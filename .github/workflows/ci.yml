name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${ACT:-}" = "true" ]; then
            # Local act runs this job directly on the host, so we reuse the
            # developer's toolchain instead of trying to recreate a GitHub
            # runner inside Docker.
            command -v cmake
            command -v ninja
            command -v nasm
            command -v cpio
            command -v xorriso
            command -v qemu-system-x86_64
            command -v python3
            command -v clang-format
          else
            sudo apt-get update
            sudo apt-get install -y nasm cpio xorriso ovmf qemu-system-x86 cmake ninja-build python3 clang-format
          fi

      - name: Enable Homebrew
        if: ${{ !env.ACT }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$HOMEBREW_PREFIX/sbin" >> "$GITHUB_PATH"

      - name: Install cross toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${ACT:-}" = "true" ]; then
            command -v x86_64-elf-gcc
            command -v x86_64-elf-g++
            command -v x86_64-elf-ld
          else
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            brew install x86_64-elf-gcc
          fi

      # tools/verify.sh is the shared local/CI contract. Its full mode makes
      # missing UEFI coverage a configure-time error and keeps allocator debug
      # instrumentation enabled in both host and freestanding builds.
      - name: Run full repository verification
        run: tools/verify.sh full

      - name: Upload smoke failure evidence
        if: ${{ failure() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: os1-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/artifacts/*.log
            build/artifacts/*.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
